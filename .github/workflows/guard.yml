# Required check "guard": retail-data guard and YAML lint.
# GitHub-hosted runners only. Never add a self-hosted runner to a public repo.
name: guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Retail-data guard
        run: python3 scripts/check_no_retail.py --all

      - name: Markdown links
        run: python3 scripts/check_links.py

      - name: YAML lint
        run: |
          python3 -m pip install --disable-pip-version-check yamllint==1.38.0
          python3 -m yamllint -s .
